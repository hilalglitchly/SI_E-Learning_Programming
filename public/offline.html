<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FFD700">
    <title>Offline — E-FORVM</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f4f4f0;
            color: #000;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border: 4px solid #000;
            box-shadow: 8px 8px 0 #000;
            padding: 28px 24px;
            text-align: center;
        }
        .badge {
            display: inline-block;
            background: #FFD700;
            border: 3px solid #000;
            box-shadow: 4px 4px 0 #000;
            font-weight: 900;
            font-family: monospace;
            font-size: 1.1rem;
            padding: 6px 14px;
            margin-bottom: 18px;
        }
        h1 { font-size: 1.5rem; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; }
        p { font-size: 0.95rem; line-height: 1.5; color: #333; margin-bottom: 22px; }
        button {
            width: 100%;
            padding: 12px 16px;
            background: #FFD700;
            color: #000;
            border: 3px solid #000;
            box-shadow: 4px 4px 0 #000;
            font-weight: 900;
            font-size: 0.95rem;
            text-transform: uppercase;
            cursor: pointer;
        }
        button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #000; }
    </style>
</head>
<body>
    <main class="card">
        <div class="badge">&lt;/&gt; E-FORVM</div>
        <h1>Tidak Ada Koneksi</h1>
        <p>Perangkat Anda sedang offline. Sambungkan kembali ke internet untuk membuka kelas, tugas, kuis, dan diskusi E-FORVM.</p>
        <button type="button" onclick="window.location.reload()">Muat Ulang</button>
    </main>
</body>
</html>
